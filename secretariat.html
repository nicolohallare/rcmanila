<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Secretariat · Rotary Club of Manila</title>
<link rel="icon" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
body{background:var(--tint)}
.ed-head{background:var(--navy);color:#fff}
.ed-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.ed-head .chip{background:#fff;border-radius:6px;padding:6px 10px}
.ed-head .chip img{height:34px;width:auto}
.ed-head a{color:var(--gold);font-weight:600}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--ink-2)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],textarea{font:inherit;font-size:16px;border:1px solid #c7d2df;border-radius:6px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.55}
.drop{border:2px dashed #9fb3cb;border-radius:12px;padding:44px 20px;text-align:center;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--blue);background:var(--sky)}
.drop strong{font-size:20px;color:var(--navy)}
.bar{height:12px;border-radius:6px;background:#e3e8ef;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:16px}
.steps li{display:flex;gap:12px;align-items:center}
.dot{width:26px;height:26px;border-radius:13px;border:2px solid #9fb3cb;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.dot.run{border-color:var(--blue);border-top-color:transparent;animation:spin 1s linear infinite}
.dot.ok{background:#1d7a46;border-color:#1d7a46}
.dot.err{background:#a3262a;border-color:#a3262a}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}
.thumbs{display:flex;gap:6px;overflow:hidden;height:92px}
.thumbs img{height:92px;width:auto;border:1px solid var(--line);border-radius:3px}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alist li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eef1f5}
.alist img{width:64px;height:46px;object-fit:cover;border-radius:4px;background:var(--sky);flex-shrink:0}
.tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:12px;white-space:nowrap}
.tag.wait{background:#eef1f5;color:var(--muted)}
.tag.run{background:var(--sky);color:var(--blue)}
.tag.ok{background:#e2f4e8;color:#1d7a46}
.tag.flag{background:#fdf0d5;color:#8a4b00}
.tag.off{background:#f3e3e3;color:#8a2b2b}
.review{display:grid;grid-template-columns:280px minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
@media (max-width:1100px){.review{grid-template-columns:1fr}}
.rlist{list-style:none;margin:0;padding:0}
.rlist button{width:100%;text-align:left;border:0;border-left:4px solid transparent;background:#fff;padding:12px 14px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid #eef1f5}
.rlist button[aria-current="true"]{background:var(--sky);border-left-color:var(--blue)}
.rlist b{font-size:15px}
.printed{display:flex;flex-direction:column;gap:10px;max-height:78vh;overflow:auto}
.printed img{width:100%;border:1px solid var(--line);border-radius:4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcell{border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:6px;background:#fff}
.pcell img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.pcell.off img{opacity:.35}
.pcell textarea{min-height:56px;font-size:13px;padding:6px}
.pcell .row{gap:6px}
.smallbtn{font:inherit;font-size:13px;font-weight:700;border:1px solid #c7d2df;background:#fff;border-radius:5px;padding:5px 8px;cursor:pointer}
.note{background:#fdf0d5;border:1px solid #f0cf8a;border-radius:8px;padding:12px 14px;color:#5c3a00}
.okbox{background:#e8f5ec;border:1px solid #b9dcc6;border-radius:10px;padding:18px}
.err{color:#a3262a;font-weight:600}
.muted{color:var(--muted)}
.hidden{display:none!important}
.sharemsg{white-space:pre-line;background:#f8fafc;border:1px solid #c7d2df;border-radius:8px;padding:12px;font-size:15px}

.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.quick{background:var(--sky);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.quick textarea{min-height:110px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:16px}
.check input{width:22px;height:22px}
.poster-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.poster-row img{width:120px;border-radius:6px;border:1px solid var(--line)}
.slist{list-style:none;margin:0;padding:0;counter-reset:n}
.slist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eef1f5;font-size:15px}
.slist li::before{counter-increment:n;content:counter(n) ".";min-width:28px;color:var(--muted);font-variant-numeric:tabular-nums}
.slist .nm{flex:1}
.slist .src{font-size:12px;color:var(--muted);white-space:nowrap}
.slist button{border:0;background:none;color:#a3262a;cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--tint);border-radius:8px;padding:8px 12px;font-size:14px}
.stat b{font-size:20px;display:block;color:var(--navy)}
.mlist li{flex-wrap:wrap}
label.f input,label.f textarea{font-weight:400}
</style>
</head>
<body>
<header class="ed-head"><div class="wrap">
<span class="chip"><img src="/assets/logo.png" alt="Rotary Club of Manila"></span>
<strong style="font-size:18px">Secretariat</strong>
<a href="/meeting" target="_blank" rel="noopener">View the website ↗</a>
</div></header>

<main class="wrap" style="padding-block:28px;display:flex;flex-direction:column;gap:20px">

<section id="v-login" class="panel stack" style="max-width:420px">
<h1 style="font-size:28px">Sign in</h1>
<form id="login-form" class="stack">
<label class="f" for="code">Secretariat passcode<input id="code" type="password" autocomplete="current-password" required></label>
<button class="btn btn-blue" type="submit">Continue</button>
<p id="login-err" class="err hidden" role="alert"></p>
</form>
</section>

<section id="v-list" class="stack hidden">
<div class="row" style="justify-content:space-between"><h1 style="font-size:30px">Weekly meetings</h1>
<div class="row"><button class="btn btn-blue" id="new-meeting" type="button">+ New meeting</button><button class="smallbtn" id="signout" type="button">Sign out</button></div></div>
<div class="panel stack"><ul id="mlist" class="alist mlist"><li class="muted">Loading…</li></ul></div>
</section>

<section id="v-edit" class="stack hidden">
<div class="row" style="justify-content:space-between">
<div><button class="smallbtn" id="back" type="button">← All meetings</button><h1 style="font-size:28px;margin-top:10px" id="ed-title">Meeting</h1></div>
<div class="row" id="ed-links"></div>
</div>
<div class="two">
<form class="panel stack" id="mform" novalidate>
<div class="quick">
<strong>Quick fill: paste the Viber announcement</strong>
<textarea id="paste" placeholder="Paste the announcement message here. The list of attendees can stay in; it won't be copied into the details."></textarea>
<div class="row"><button class="btn btn-blue" type="button" id="fill">Fill in the form</button><span id="fill-msg" class="muted" aria-live="polite"></span></div>
</div>
<div class="grid2">
<label class="f">Meeting date<input type="date" name="meeting_date" required></label>
<label class="f">Meeting name<input type="text" name="label" placeholder="e.g. 13th Weekly Membership Meeting"></label>
</div>
<label class="f">Topic<input type="text" name="topic"></label>
<div class="grid2">
<label class="f">Speaker<input type="text" name="speaker"></label>
<label class="f">Speaker's position<input type="text" name="speaker_title"></label>
</div>
<div class="grid2">
<label class="f">Meeting time<input type="text" name="time_text" placeholder="12:15 PM"></label>
<label class="f">Registration / lunch<input type="text" name="registration_text" placeholder="Registration and lunch from 11:00 AM"></label>
</div>
<label class="f">Venue<input type="text" name="venue"></label>
<label class="f">Also this week <span class="muted" style="font-weight:400">(elections, special events, dress code, Zoom link)</span><textarea name="notes" style="min-height:80px"></textarea></label>
<label class="f">About the speaker <span class="muted" style="font-weight:400">(start a line with • for a list)</span><textarea name="speaker_bio" style="min-height:140px"></textarea></label>
<div class="stack" style="gap:8px"><strong style="font-size:14px;color:var(--ink-2)">Poster</strong>
<div class="poster-row"><img id="poster-img" alt="" hidden><label class="btn btn-line" style="color:var(--blue)">Upload poster image<input type="file" id="poster-file" accept="image/*" class="hidden"></label><button type="button" class="smallbtn" id="poster-rm" hidden>Remove poster</button><span id="poster-msg" class="muted"></span></div></div>
<label class="check"><input type="checkbox" name="published"> Show this meeting on the website</label>
<label class="check"><input type="checkbox" name="rsvp_open" checked> Accept sign-ups on the website</label>
<div class="row" style="justify-content:space-between"><button type="button" class="smallbtn" id="del" style="color:#a3262a">Delete meeting</button><button class="btn btn-blue" type="submit" id="save">Save</button></div>
<p id="save-msg" class="muted" aria-live="polite"></p>
</form>

<div class="panel stack" id="spanel">
<div class="row" style="justify-content:space-between"><h2 style="font-size:24px">Who's coming</h2><button class="smallbtn" id="refresh" type="button">Refresh</button></div>
<div class="stats" id="stats"></div>
<div class="row"><button class="btn btn-gold" type="button" id="copy-list">Copy list</button><button class="btn btn-line" style="color:var(--blue)" type="button" id="dl">Download for Excel</button></div>
<ol class="slist" id="slist"></ol>
<details><summary style="cursor:pointer;font-weight:700;color:var(--blue)">Add names by hand</summary>
<div class="stack" style="margin-top:10px"><textarea id="add-text" placeholder="One name per line. You can paste the list from Viber; numbers are removed and lines with 'guest of' are marked as guests."></textarea>
<div class="row"><button class="btn btn-blue" type="button" id="add-btn">Add to list</button><span id="add-msg" class="muted"></span></div></div></details>
</div>
</div>
</section>
</main>
<script src="/assets/secretariat.js"></script>
</body>
</html>
